name: Deploy site

# The komando site deploys only from a v* tag on main, or a manual run on such a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komando-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a v* tag in this repo deploys; the job runs on a GitHub-hosted runner.
    if: github.repository == 'efolusi/komando' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history includes origin/main, so the next step needs no fetch,
          # and the checkout token is not kept in .git/config.
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse anything but a v* tag on main
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      # No package cache in the deploy job: a cache written by another job must
      # not feed the production build (zizmor cache-poisoning).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      # A commit whose home page names an older komando release than the newest
      # one does not deploy (fix: set_release.py, README.md "Release").
      - name: Refuse a page that names an older komando release
        run: python3 -I web/deploy/check_release.py
      - run: python3 -I web/deploy/test_build_dist.py
      - run: python3 -I web/deploy/build_dist.py
      - run: npx --yes wrangler@4.164.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # From outside: the live home pages serve this commit and name the newest
      # komando release.
      - name: Check the live site
        run: python3 -I web/deploy/check_release.py --live --sha "$GITHUB_SHA"
