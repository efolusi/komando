name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    # The repo is public, so every job runs on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -I web/deploy/test_build_dist.py
      - run: python3 -I web/deploy/build_dist.py
