name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    # The repo is public, so every job runs on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -I web/deploy/test_build_dist.py
      - run: python3 -I web/deploy/build_dist.py
      - run: python3 -I web/deploy/test_check_release.py
      - run: python3 -I web/deploy/test_check_download.py
      # The draft pages (W28) stay off, and a switched-on page names a download that exists.
      - run: python3 -I web/deploy/check_download.py
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
      - run: pnpm install --frozen-lockfile
        working-directory: web/site
      - run: node --test test/
        working-directory: web/site
      # The committed HTML must match what build.mjs renders.
      - run: node build.mjs && git diff --exit-code
        working-directory: web/site
